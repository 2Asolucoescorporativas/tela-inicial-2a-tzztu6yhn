<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>2A Rural</title>
    <meta name="description" content="Emissor de documentos fiscais para produtores rurais" />
    <meta name="author" content="Skip (https://goskip.dev)" />

    <!-- PWA Icons — 2A Rural branded SVG icons (scalable, maskable-safe) -->
    <link rel="icon" type="image/svg+xml" href="/icons/app-icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/app-icon-192.svg" />

    <!-- Open Graph -->
    <meta property="og:image" content="/icons/app-icon-512.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & Status Bar -->
    <meta name="theme-color" content="#002C45" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="2A Rural" />

    <!--
      iOS Splash Screen
      =================
      SVG support for apple-touch-startup-image is limited on iOS.
      The inline HTML splash screen inside #root (below) is the primary
      cross-platform mechanism — it renders instantly before any JS loads
      and is replaced automatically when React mounts.

      For Android, background_color and theme_color in manifest.json
      produce the native splash with the 512×512 icon centered.
    -->
    <link rel="apple-touch-startup-image" href="/icons/splash-iphone.svg" />
    <link
      rel="apple-touch-startup-image"
      href="/icons/splash-ipad.svg"
      media="(min-device-width: 768px) and (min-device-height: 768px)"
    />
  </head>

  <body>
    <!--
      ====================================================================
      RELEASE NOTES — PWA Icon & Native Splash Screen
      ====================================================================
      For all changes to take effect, users MUST:
      1. Uninstall the old PWA from the home screen
      2. Clear browser cache and service workers
         (Browser Settings > Privacy > Site Data > Clear)
      3. Reinstall the PWA by visiting the URL and selecting
         "Add to Home Screen"
      This ensures the new icon, splash screen, and theme colors
      replace any cached versions from the previous installation.
      ====================================================================
    -->

    <div id="root">
      <!--
        Native Splash Screen
        ====================
        Renders instantly on page load (zero JS dependency).
        React replaces this content when the app mounts, providing
        a seamless transition from native splash to the app UI.
      -->
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#002C45;z-index:9999;">
        <img src="/icons/app-icon-192.svg" alt="2A Rural" style="width:192px;height:192px;" />
      </div>
    </div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js", { scope: "/" });
      }
    </script>
  </body>
</html>
